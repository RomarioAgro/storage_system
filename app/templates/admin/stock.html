{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Остатки</h1>
  <p class="muted">Просмотр остатков по ячейкам и товарам.</p>
  <a class="button" href="/admin">Вернуться в админ-панель</a>
</section>

<section class="panel" id="stock">
  <h2>Остатки</h2>
  <form method="post" action="/admin/stock" class="grid">
    <label><span>Товар</span><select name="product_id">{% for product in products %}<option value="{{ product.id }}">{{ product.name }}</option>{% endfor %}</select></label>
    <label><span>Ячейка</span><select name="cell_id">{% for cell in cells %}<option value="{{ cell.id }}">{{ cell.number }}</option>{% endfor %}</select></label>
    <label><span>Количество</span><input name="quantity" value="0.000"></label>
    <button type="submit">Добавить строку остатка</button>
  </form>
  <table>
    <thead><tr><th>Ячейка</th><th>Товар</th><th>Количество</th></tr></thead>
    <tbody>{% for item in stock_items %}<tr><td>{{ item.cell.number }}</td><td>{{ item.product.name }}</td><td>{{ item.quantity }}</td></tr>{% endfor %}</tbody>
  </table>
</section>
{% endblock %}
